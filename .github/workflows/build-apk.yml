name: Build GroupFinance V6 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract new project
        shell: bash
        run: |
          set -e
          ZIP_FILE=$(find . -maxdepth 1 -type f -name '*.zip' | head -n 1)
test -n "$ZIP_FILE"
          test -f "$ZIP_FILE"
          mkdir -p /tmp/gf_project
          unzip -q "$ZIP_FILE" -d /tmp/gf_project
          test -f /tmp/gf_project/settings.gradle
          test -f /tmp/gf_project/build.gradle
          test -f /tmp/gf_project/app/build.gradle
          cp -a /tmp/gf_project/. .

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Check APK
        run: test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GroupFinance-V6-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
