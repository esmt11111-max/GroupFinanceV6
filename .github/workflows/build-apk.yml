name: Build GroupFinance V6 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        shell: bash
        run: |
          set -e
          ZIP_FILE="GroupFinanceV6_PROJECT_ONLY.zip"
          test -f "$ZIP_FILE"
          echo "Found ZIP file, extracting..."
          mkdir -p extracted_files
          unzip -q "$ZIP_FILE" -d extracted_files
          INNER_DIR=$(find extracted_files -mindepth 1 -maxdepth 1 -type d | head -n 1)
          if [ -n "$INNER_DIR" ]; then
            echo "Moving contents from $INNER_DIR to root..."
            shopt -s dotglob
            mv "$INNER_DIR"/* ./
            shopt -u dotglob
          else
            cp -r extracted_files/* ./
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify project files
        run: |
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          chmod +x ./gradlew

      - name: Build APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GroupFinance-V6-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
