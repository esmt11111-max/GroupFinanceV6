name: Build GroupFinance V6 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP and Debug
        shell: bash
        run: |
          set -e
          ZIP_FILE="GroupFinanceV6_PROJECT_ONLY.zip"
          echo "Listing repository files:"
          ls -la
          test -f "$ZIP_FILE"
          echo "Extracting ZIP..."
          mkdir -p extracted_files
          unzip -q "$ZIP_FILE" -d extracted_files
          echo "Contents of extracted_files:"
          ls -la extracted_files
          
          # Flatten structure automatically
          INNER_DIR=$(find extracted_files -mindepth 1 -maxdepth 1 -type d | head -n 1)
          if [ -n "$INNER_DIR" ]; then
            echo "Moving contents from $INNER_DIR to root..."
            shopt -s dotglob
            mv "$INNER_DIR"/* ./
            shopt -u dotglob
          else
            cp -r extracted_files/* ./
          fi
          
          echo "Root files after extraction:"
          ls -la

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GroupFinance-V6-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
