name: Build GroupFinance V6 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP and Locate Gradle
        shell: bash
        run: |
          set -e
          ZIP_FILE="GroupFinanceV6_PROJECT_ONLY.zip"
          test -f "$ZIP_FILE"
          echo "Extracting ZIP..."
          mkdir -p extracted_files
          unzip -q "$ZIP_FILE" -d extracted_files
          
          # Find where gradlew is hidden inside extracted files and copy project contents to root
          INNER_DIR=$(find extracted_files -name "gradlew" -type f -exec dirname {} \;)
          if [ -n "$INNER_DIR" ]; then
            echo "Found gradlew in: $INNER_DIR"
            shopt -s dotglob
            cp -r "$INNER_DIR"/* ./
            shopt -u dotglob
          else
            echo "Gradlew not found via find, copying all..."
            cp -r extracted_files/* ./
          fi
          
          echo "Verifying gradlew exists in root:"
          ls -la gradlew

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GroupFinance-V6-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
