name: Build GroupFinance V6 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP automatically
        shell: bash
        run: |
          set -e
          # البحث عن أي ملف مضغوط zip في المستودع وفكه تلقائياً
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Found ZIP file: $ZIP_FILE, extracting..."
            mkdir -p extracted_files
            unzip -q "$ZIP_FILE" -d extracted_files
            
            # نقل الملفات المستخرجة إلى الجذر
            INNER_DIR=$(find extracted_files -mindepth 1 -maxdepth 1 -type d | head -n 1)
            if [ -n "$INNER_DIR" ]; then
              shopt -s dotglob
              mv "$INNER_DIR"/* ./
              shopt -u dotglob
            else
              cp -r extracted_files/* ./
            fi
          else
            echo "No zip file found, assuming files are already in root."
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GroupFinance-V6-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
